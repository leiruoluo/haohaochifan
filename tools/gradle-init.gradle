// 好好吃饭 - 中国大陆构建镜像配置（Gradle）
// 用法（任选其一）：
//   1) 复制本文件到 ~/.gradle/init.gradle（推荐，全局生效）
//   2) 构建时加参数：./gradlew -I tools/gradle-init.gradle ...
// 作用：将 google()/mavenCentral() 替换为阿里云国内镜像，
//       避免直连被墙的 dl.google.com；对插件子工程同样生效。
allprojects {
    buildscript {
        repositories {
            clear()
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
    }
    repositories {
        clear()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
