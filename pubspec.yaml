name: haohaochifan
description: "好好吃饭 - 为身材管理而生的饮食记录工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 数据库
  sqflite: ^2.4.0
  sqflite_common: ^2.5.0
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.7.6
  sqflite_common_ffi_web: ^0.4.0
  path: ^1.9.0
  path_provider: ^2.1.0

  # 状态与工具
  provider: ^6.1.0
  intl: ^0.20.0
  file_picker: ^12.0.0

  # 图表与二维码
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0

  # 局域网同步
  http: ^1.2.0
  shelf: ^1.4.0

  # 提醒
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/foods_v6.json
